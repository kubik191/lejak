name: vesna-collector

x-common: &common
  build: .
  image: vesna-collector:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATA_DIR: /app/data
  volumes:
    # Named volume: inherits the image's ownership, so the non-root user can write to it.
    - collector-data:/app/data
  restart: unless-stopped

services:
  web:
    <<: *common
    command: ["python", "-m", "collector", "web", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *common
    command: ["python", "-m", "collector", "worker"]
    stop_grace_period: 30s

volumes:
  collector-data:
